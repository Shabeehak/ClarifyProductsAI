[pytest]
# Pytest Configuration for ClarifyProducts.AI

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Command line options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Strict marker checking
    --strict-markers
    # Show summary of all test outcomes
    -ra
    # Disable warnings
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    slow: Tests that take significant time to run (>1s)
    ml: Tests involving ML model loading/inference
    api: API endpoint tests
    service: Service layer tests
    scraper: Web scraping tests
    cache: Caching functionality tests
    database: Database operation tests
    clip: CLIP model tests
    rag: RAG/vector database tests

# Async test configuration
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore directories
norecursedirs =
    .git
    .venv
    venv
    __pycache__
    *.egg-info
    build
    dist

# Minimum Python version
minversion = 3.9
